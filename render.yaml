# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: on render.com, click "New +" -> "Blueprint", connect this repo,
# and Render will read this file and set everything up automatically.
#
# After it deploys, Render gives you a URL like
# https://astrovastu-api.onrender.com — that's what you pass as `api_url`
# when running the "Build Android APK" GitHub Action.
#
# IMPORTANT — free plan has no persistent disk:
# Render's free web services only get an ephemeral filesystem. The SQLite
# database and any uploaded floor-plan images are wiped every time the
# service redeploys, and also whenever it spins back up after going idle
# (free services sleep after ~15 minutes with no traffic, and wake up as a
# fresh container on the next request). That's fine for trying the app out,
# but any accounts/kundalis/vastu plans created will disappear sooner or
# later. There's no way to make storage persistent on the free plan.
#
# When you're ready for real users' data to stick around, switch `plan`
# below to `starter` (or higher) and add a `disk` block, e.g.:
#   disk:
#     name: astrovastu-data
#     mountPath: /data
#     sizeGB: 1
services:
  - type: web
    name: astrovastu-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render auto-generates and stores a strong random value for this.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # Turn off the passwordless demo login once real users can reach this URL.
      - key: AUTH_DEV_LOGIN
        value: "false"
      # Fill these in from the Render dashboard once you have them
      # (they're optional — the login button they control just stays
      # hidden in the app until you set them).
      - key: CORS_ORIGINS
        value: ""
      - key: GOOGLE_CLIENT_IDS
        value: ""
      - key: FACEBOOK_APP_ID
        value: ""
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: APPLE_AUDIENCES
        value: com.astrovastu.app
      - key: ANTHROPIC_API_KEY
        sync: false
