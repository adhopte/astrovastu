name: Build Android APK

# Manual trigger only — open the Actions tab, pick this workflow, "Run workflow".
# The app is fully offline (on-device SQLite + local files), so no backend
# URL or other configuration is needed to build it.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      # Every build otherwise gets its own freshly auto-generated debug
      # keystore, which means Android refuses to install a newer build over
      # an older one ("App not installed" — same package name, different
      # signing key). Caching this one file keeps every build on this branch
      # signed identically: the first run generates it, every run after
      # restores that same file so Gradle's ensureDebugKeystoreExists task
      # (which only generates one when the file is missing) leaves it alone.
      - name: Cache debug keystore (keeps every build's signature identical)
        uses: actions/cache@v4
        with:
          path: mobile/android/app/debug.keystore
          key: astrovastu-debug-keystore

      # A "release" build type here (still signed with the debug keystore
      # above, not a Play Store key) is what actually installs and runs
      # standalone. A debug APK expects to fetch its JavaScript live from a
      # Metro dev server on your computer and errors with "Unable to load
      # script" the moment it's installed on its own — this bundles the JS
      # into the APK instead, via Hermes, exactly like assembleDebug does not.
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astrovastu-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
